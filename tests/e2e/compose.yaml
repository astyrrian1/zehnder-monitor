name: zehnder-monitor-e2e
services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:18884:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: 'no'
  ha:
    image: ghcr.io/home-assistant/home-assistant:stable
    ports:
      - "18123:8123"
    volumes:
      - ./ha:/config
    depends_on:
      - mqtt
    restart: 'no'
  appdaemon:
    image: acockburn/appdaemon:latest
    profiles: [publisher]
    volumes:
      - ./appdaemon:/conf
    depends_on:
      - ha
    restart: 'no'
