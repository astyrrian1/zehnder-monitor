title: Zehnder Test Monitor
views:
  - title: Corrected ventilation efficiency
    path: zehnder
    cards:
      - type: entities
        title: Corrected SFP and exact inputs
        entities:
          - entity: sensor.zehnder_corrected_sfp
            name: Corrected SFP
          - entity: sensor.zehnder_comfoair_q_a4cb9c_power
            name: Power (W)
          - entity: sensor.zehnder_comfoair_q_a4cb9c_supply_fan_flow
            name: Supply airflow (m³/h)
          - entity: sensor.zehnder_comfoair_q_a4cb9c_exhaust_fan_flow
            name: Exhaust airflow (m³/h)
      - type: markdown
        title: Measurement provenance
        content: >-
          {% set attrs = state_attr('sensor.zehnder_corrected_sfp', 'inputs') %}
          {% if attrs %}
          Calculated: {{ state_attr('sensor.zehnder_corrected_sfp', 'calculated_at') }}.
          Power: {{ attrs.power.value }} {{ attrs.power.unit }} (reported {{ attrs.power.reported_at }}).
          Supply: {{ attrs.supply_flow.value }} {{ attrs.supply_flow.unit }} (reported {{ attrs.supply_flow.reported_at }}).
          Exhaust: {{ attrs.exhaust_flow.value }} {{ attrs.exhaust_flow.unit }} (reported {{ attrs.exhaust_flow.reported_at }}).
          {% else %}Awaiting corrected SFP.{% endif %}
      - type: markdown
        title: Reading quality
        content: >-
          {% set q = states('sensor.zehnder_corrected_sfp_quality') %}
          {% set reason = state_attr('sensor.zehnder_corrected_sfp_quality', 'reason') %}
          {% if q == 'current' %}Current measurement from reported source values.
          {% elif q == 'stopped' %}Fans stopped or airflow is zero; SFP is unavailable.
          {% elif q == 'stale' %}Source reporting is older than 10 minutes; SFP is unavailable.
          {% elif q == 'unknown_freshness' %}Source report time is unknown; SFP is unavailable.
          {% elif q == 'unsupported' %}Source units are unsupported; SFP is unavailable.
          {% elif q == 'invalid' %}Source values are invalid; SFP is unavailable.
          {% elif q == 'unavailable' %}Required source values are unavailable.
          {% else %}Monitor publication is unavailable or has expired.
          {% endif %}
          {% if reason %}Reason: {{ reason }}.{% endif %}
          Fan-effort inputs: {{ state_attr('sensor.zehnder_corrected_sfp_quality', 'fan_effort_quality') or 'unknown' }}
          ({{ state_attr('sensor.zehnder_corrected_sfp_quality', 'fan_effort_reason') or 'no reason' }}).
          Recovery inputs: {{ state_attr('sensor.zehnder_corrected_sfp_quality', 'recovery_quality') or 'unknown' }}
          ({{ state_attr('sensor.zehnder_corrected_sfp_quality', 'recovery_reason') or 'no reason' }}).
          Baseline sampling: {% if state_attr('sensor.zehnder_corrected_sfp_quality', 'baseline_eligible') %}eligible{% else %}ineligible{% endif %}
          ({{ state_attr('sensor.zehnder_corrected_sfp_quality', 'eligibility_reason') or 'not assessed' }}).
      - type: entities
        title: Legacy readings (historical method)
        entities:
          - entity: sensor.zehnder_sfp
            name: Legacy SFP
      - type: markdown
        title: Clean-filter reference
        content: >-
          {% set state = states('sensor.zehnder_corrected_calibration') %}
          {% if state == 'awaiting_confirmation' %}
          **Awaiting confirmed clean-filter reference.** Confirm that both
          supply and exhaust filter paths have clean filters after maintenance
          to begin learning. Absolute SFP remains available; no corrected
          comparison or replacement estimate is available yet.
          {% elif state == 'settling' %}
          **Settling after confirmed maintenance.** Both filter paths were
          confirmed clean at {{ state_attr('sensor.zehnder_corrected_calibration', 'confirmed_at') }}.
          Learning begins at {{ state_attr('sensor.zehnder_corrected_calibration', 'settling_until') }}.
          {% elif state == 'learning' %}
          **Learning clean-filter references.** Candidate counts:
          {{ state_attr('sensor.zehnder_corrected_calibration', 'candidate_counts') }}.
          Collection closes at {{ state_attr('sensor.zehnder_corrected_calibration', 'learning_until') }}.
          {% elif state == 'qualified' %}
          **Clean-filter reference qualified.** Captured from confirmed
          maintenance cycle {{ state_attr('sensor.zehnder_corrected_calibration', 'cycle_id') }}.
          {% elif state == 'partial' %}
          **Learning closed with partial coverage.** Unvisited operating points
          and unqualified metrics remain unavailable.
          {% else %}Calibration state unavailable.{% endif %}
          {% if state_attr('sensor.zehnder_corrected_calibration', 'timer_confirmation_requested') %}
          The maintenance timer increased. Confirm both filter paths are clean
          only after checking them; the timer alone does not establish a new reference.
          {% endif %}
      - type: markdown
        title: Reference capture details
        content: |-
          Cycle: {{ state_attr('sensor.zehnder_corrected_calibration', 'cycle_id') or 'none' }}.
          Confirmed: {{ state_attr('sensor.zehnder_corrected_calibration', 'confirmed_at') or 'not yet' }}.
          {% set counts = state_attr('sensor.zehnder_corrected_calibration', 'candidate_counts') or {} %}
          {% set refs = state_attr('sensor.zehnder_corrected_calibration', 'references') or {} %}
          {% for point, metrics in refs.items() %}
          **{{ point }}:**
          {% for name, ref in metrics.items() %}
          - {{ name }}: {{ ref.count }} reports, {{ ref.first_reported_at }} to {{ ref.last_reported_at }};
            median supply {{ ref.supply_flow_m3h | round(1) }} m³/h,
            exhaust {{ ref.exhaust_flow_m3h | round(1) }} m³/h.
          {% endfor %}
          {% endfor %}
          {% if not refs %}No qualified reference yet. Candidate counts: {{ counts }}.{% endif %}
      - type: button
        name: Confirm both filter paths are clean
        icon: mdi:air-filter
        entity: input_button.zehnder_confirm_clean_filters
        tap_action:
          action: perform-action
          perform_action: input_button.press
          target:
            entity_id: input_button.zehnder_confirm_clean_filters
          confirmation:
            text: Confirm both supply and exhaust filter paths have clean filters after maintenance.
      - type: entities
        title: Reference provenance
        entities:
          - entity: sensor.zehnder_corrected_calibration
            name: Corrected calibration state
          - entity: sensor.zehnder_corrected_sfp_change
            name: SFP change vs confirmed clean reference
          - entity: sensor.zehnder_baseline_quality
            name: Legacy baseline quality (context only)
      - type: entities
        title: Matched-flow fan effort
        entities:
          - entity: sensor.zehnder_corrected_sfp_change
            name: SFP change (%)
          - entity: sensor.zehnder_corrected_supply_duty_change_pp
            name: Supply duty change (percentage points)
          - entity: sensor.zehnder_corrected_exhaust_duty_change_pp
            name: Exhaust duty change (percentage points)
          - entity: sensor.zehnder_corrected_supply_rpm_flow_change_pct
            name: Supply RPM per airflow change (%)
          - entity: sensor.zehnder_corrected_exhaust_rpm_flow_change_pct
            name: Exhaust RPM per airflow change (%)
      - type: markdown
        title: Comparison support
        content: >-
          {% set q = states('sensor.zehnder_corrected_comparison_quality') %}
          {% if q == 'ready' %}Conditioned 15-minute comparison is ready.
          {% elif q == 'warming_up' %}Warming up: at least five distinct matched observations are required.
          {% elif q == 'no_matching_reference' %}No matching clean-filter reference for this fan level and both airflows.
          {% elif q == 'ineligible' %}Current conditions are not eligible for a conditioned comparison.
          {% else %}Comparison unavailable while current measurement is unavailable.
          {% endif %}
          {% set ref = state_attr('sensor.zehnder_corrected_comparison_quality', 'selected_reference') %}
          Selected reference: {% if ref %}{{ ref.point }} from cycle {{ ref.cycle_id }}{% else %}none{% endif %}.
          Accepted observations in window: {{ state_attr('sensor.zehnder_corrected_comparison_quality', 'window_count') or 0 }}.
